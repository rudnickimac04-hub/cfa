<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CFA Prep — CFA Level I (2027) Study Platform</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%2316418e'/%3E%3Ctext x='50' y='68' font-size='46' font-family='Segoe UI,Arial' font-weight='800' text-anchor='middle' fill='white'%3ECFA%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand" id="brand-home" title="Dashboard">
        <span class="brand-mark">CFA</span><span class="brand-text">Prep</span><span class="brand-badge">2027</span>
      </div>
      <nav class="main-nav" id="main-nav">
        <button class="nav-btn" data-view="dashboard">Dashboard</button>
        <button class="nav-btn" data-view="curriculum">Curriculum</button>
        <button class="nav-btn" data-view="search">Search</button>
        <button class="nav-btn" data-view="quiz">Mock Tests</button>
        <button class="nav-btn" data-view="flashcards">Flashcards</button>
        <button class="nav-btn" data-view="calculators">Calculators</button>
      </nav>
      <div class="top-actions">
        <button class="icon-btn" id="theme-toggle" title="Toggle dark / light">🌙 Dark</button>
      </div>
    </div>
  </header>

  <main id="app" class="app-main"></main>

  <!-- Data (classic scripts so it works from file://) -->
  <script src="js/data/curriculum.js"></script>
  <script src="js/data/content.js"></script>
  <script src="js/data/questions.js"></script>
  <script src="js/data/flashcards.js"></script>

  <!-- Libraries -->
  <script src="js/lib/storage.js"></script>
  <script src="js/lib/srs.js"></script>
  <script src="js/lib/charts.js"></script>

  <!-- Views (register onto window.CFA.views before the shell boots) -->
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/curriculum.js"></script>
  <script src="js/views/search.js"></script>
  <script src="js/views/quiz.js"></script>
  <script src="js/views/flashcards.js"></script>

  <!-- App shell -->
  <script src="js/app.js"></script>
</body>
</html>
